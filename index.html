<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #game-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }

    #click-to-play {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-family: 'Courier New', monospace;
      z-index: 100;
      cursor: pointer;
      user-select: none;
    }
    #click-to-play h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      color: #d4a84b;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 0.5rem;
    }
    #click-to-play p {
      font-size: 1.1rem;
      color: #ccc;
      margin: 0.3rem 0;
    }
    #click-to-play .controls-hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      line-height: 1.7;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: 'Courier New', monospace;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.85);
      font-size: 28px;
      font-weight: bold;
      line-height: 1;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
    }

    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 3px;
    }
    .hotbar-slot {
      width: 50px;
      height: 50px;
      border: 2px solid #555;
      background: rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hotbar-slot.selected {
      border-color: #fff;
      border-width: 2px;
      box-shadow: 0 0 0 1px #fff;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      top: 2px; left: 4px;
      font-size: 9px;
      color: #aaa;
    }
    .hotbar-slot .slot-icon {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }

    #block-name {
      position: absolute;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 13px;
      text-shadow: 1px 1px 0 #000;
      white-space: nowrap;
    }

    #debug-panel {
      position: absolute;
      top: 8px; left: 8px;
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      text-shadow: 1px 1px 0 #000;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 3px;
      display: none;
    }
    #debug-panel.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="click-to-play">
    <h1>&#x2694; BlockCraft</h1>
    <p>A Medieval Voxel World</p>
    <div class="controls-hint">
      WASD — Move &nbsp;|&nbsp; Space — Jump &nbsp;|&nbsp; Mouse — Look<br>
      Left Click — Break Block &nbsp;|&nbsp; Right Click — Place Block<br>
      1–9 — Select Block &nbsp;|&nbsp; F3 — Debug Info
    </div>
    <p style="margin-top:2rem; color:#d4a84b;">Click anywhere to play</p>
  </div>

  <div id="ui-overlay">
    <div id="crosshair">+</div>
    <div id="hotbar"></div>
    <div id="block-name"></div>
    <div id="debug-panel"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
